name: streamline-app  ## controller does not use this name, it sets name manually.
services:
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:?}
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN:?}
    deploy:
      replicas: ${CLOUDFLARE_TUNNEL_REPLICAS:?}
    networks:
      streamline-network:
        aliases:
          - cloudflared

  engine:
    image: ${ENGINE_IMAGE:?}:${ENGINE_TAG:?}
    platform: linux/amd64
    restart: unless-stopped
    command: --frontegg-env=${FRONTEGG_ENVIRONMENT:?} --log-level=${LOG_LEVEL:?} --deployment-type=on-premises-linux --controller-url=controller-backend:80 --mcp-url=${MCP_PUBLIC_URL:-}
    volumes:
      - data:/server-data
    networks:
      streamline-network:
        aliases:
          - engine
    labels:
      # This means the container will be stopped during backup to ensure backup integrity.
      - docker-volume-backup.stop-during-backup=true


  web:
    image: ${WEB_IMAGE:?}:${WEB_TAG:?}
    platform: linux/amd64
    restart: unless-stopped
    command: --mode=http --sl-host=engine --frontegg-env=${FRONTEGG_ENVIRONMENT:?} --sl-port=8080 --sl-ws-port=8081 --admin-path=${CONTROLLER_FRONTEND_URL_PATH:?}
    volumes:
      - data:/server-data
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.web.loadbalancer.server.port=9982"
      - "traefik.http.routers.web.rule=PathPrefix(`${STREAMLINE_WEB_URL_PATH:?}`)"
      - "traefik.http.routers.web.priority=1"  ## Explicitly set priority to 1 to make sure other more specific routers are better fit.
      - "traefik.http.routers.web.service=web"
      - "traefik.http.routers.web.entrypoints=web"    
      # This means the container will be stopped during backup to ensure backup integrity.  
      - docker-volume-backup.stop-during-backup=true
    networks:
      streamline-network:
        aliases:
          - web

  # Turns the engine's HTTP API into MCP tools for AI clients.
  #
  # Opt-in, the same way cloudflared above is: the controller sets MCP_REPLICAS=1 together
  # with MCP_PUBLIC_URL when the customer enables it, and 0 with an empty URL turns it off.
  # An empty MCP_PUBLIC_URL is also what the engine's --mcp-url reads as "no MCP server".
  mcp:
    image: ${MCP_IMAGE:?}:${MCP_TAG:?}
    platform: linux/amd64
    restart: unless-stopped
    deploy:
      replicas: ${MCP_REPLICAS:-0}
    environment:
      # The engine over the internal network, the same way web reaches it. Its certificate
      # is self-signed and issued for no name in here, so verification is off.
      STREAMLINE_BASE_URL: https://engine:8080
      STREAMLINE_TLS_VERIFY: "false"
      # The same Frontegg the engine validates against - the other one issues tokens the
      # engine rejects.
      STREAMLINE_FRONTEGG_ENVIRONMENT: ${FRONTEGG_ENVIRONMENT:?}
      # The URL clients use, prefix included. Everything the OAuth flow advertises derives
      # from it: the issuer, the audience tokens are bound to, and the redirect Frontegg
      # returns the browser to. Traefik below spends the prefix getting here, so the MCP
      # endpoint sits at this container's root - where the OAuth routes are - and one
      # prefix covers both.
      STREAMLINE_MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      STREAMLINE_MCP_PATH: /
      # This deployment's Frontegg client registration and its OAuth storage, in the
      # server's own volume so the existing backup and restore already cover them. Losing
      # them registers a fresh Frontegg client - which Frontegg gives no way to delete -
      # and changes the key MCP tokens are signed with, logging every client out.
      #
      # The whole volume rather than just this subdirectory: `volume.subpath` would isolate
      # it the way the Helm chart does, but it needs Compose >= 2.30, and this file is
      # parsed on every stack operation - so on an older Docker it would break engine and
      # web too, for customers who never enable MCP. Worth revisiting once there is a
      # minimum Compose version.
      STREAMLINE_STATE_DIR: /server-data/mcp/state
      FASTMCP_HOME: /server-data/mcp/fastmcp
      STREAMLINE_MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-INFO}
    volumes:
      - data:/server-data
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.mcp.loadbalancer.server.port=9984"

      ## The endpoint and every OAuth route the server mounts (/authorize, /token,
      ## /register, /consent, /auth/callback, /.well-known/*) live under this one prefix,
      ## which is stripped here. Serving them at the host root instead would take
      ## /register and /auth/callback from the web client, which uses its own.
      - "traefik.http.routers.mcp.rule=PathPrefix(`${MCP_URL_PATH:-/mcp}`)"
      - "traefik.http.routers.mcp.service=mcp"
      - "traefik.http.routers.mcp.entrypoints=web"
      - "traefik.http.middlewares.mcp-stripprefix.stripprefix.prefixes=${MCP_URL_PATH:-/mcp}"
      - "traefik.http.routers.mcp.middlewares=mcp-stripprefix"

      ## RFC 9728 and RFC 8414 put these two documents at the *host root* with the
      ## resource's own path appended, and a client asks for the second one before it has
      ## read anything of ours. The container serves them at exactly these paths, so this
      ## router deliberately carries no stripprefix. Neither can collide with the web
      ## client: the MCP prefix is inside them.
      - "traefik.http.routers.mcp-metadata.rule=PathPrefix(`/.well-known/oauth-protected-resource${MCP_URL_PATH:-/mcp}`) || PathPrefix(`/.well-known/oauth-authorization-server${MCP_URL_PATH:-/mcp}`)"
      - "traefik.http.routers.mcp-metadata.service=mcp"
      - "traefik.http.routers.mcp-metadata.entrypoints=web"

      # This means the container will be stopped during backup to ensure backup integrity.
      - docker-volume-backup.stop-during-backup=true
    networks:
      streamline-network:
        aliases:
          - mcp
    # The port is bound only after every tool is generated, so accepting connections
    # genuinely means ready. The start_period covers parsing both OpenAPI bundles.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 9984), 2).close()
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  data:
    name: ${STREAMLINE_VOLUME_NAME:?}
    external: true

networks:
  streamline-network:
    name: ${DOCKER_NETWORK_NAME:?}
    external: true


